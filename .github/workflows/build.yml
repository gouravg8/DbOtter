# Builds the Ubuntu and Windows packages.
#
# - Push a version tag (git tag v0.0.3 && git push origin v0.0.3): builds both, checks them
#   and puts them on a draft GitHub Release, to look over and publish.
# - Actions tab → Build → Run workflow: builds both and attaches the files to the run.
#
# The builds only build. One release job after them checks every installer against its
# signature (scripts/release.py), writes latest.json once with every platform, and makes the
# draft. Two builds uploading to the same draft at once is what broke 0.0.3's Windows file.
#
# Ubuntu builds on 22.04 on purpose: its packages also run on newer Ubuntu, not the other
# way round. The Windows installer (-setup.exe) installs per user, without admin rights, and
# adds DbOtter to the Start menu and search. No .msi: it and the .exe don't know each other,
# so installing both ways would leave two copies.
#
# Updates: each build is signed with the project's updater key (repo secrets
# TAURI_SIGNING_PRIVATE_KEY / _PASSWORD; the public half is in tauri.conf.json), and the
# release gets latest.json. Installed apps read it from the latest published release, so a
# draft reaches nobody until it's published. A published release is never changed here. (Not the same as code signing, which stops the
# Windows "unknown publisher" warning; that isn't set up.)
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # the Rust cache can bring back installers of earlier versions: none may reach a release
      - name: Clear old installers
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build and sign
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Attach the files to the run
        uses: actions/upload-artifact@v4
        with:
          name: DbOtter-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/DbOtter_*.deb
            src-tauri/target/release/bundle/deb/DbOtter_*.deb.sig
            src-tauri/target/release/bundle/appimage/DbOtter_*.AppImage
            src-tauri/target/release/bundle/appimage/DbOtter_*.AppImage.sig
            src-tauri/target/release/bundle/nsis/DbOtter_*-setup.exe
            src-tauri/target/release/bundle/nsis/DbOtter_*-setup.exe.sig

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # the artifacts keep their deb/, appimage/ and nsis/ folders: side by side here
      - name: Gather the files
        run: find dist -mindepth 2 -type f -exec mv -t dist/ {} + && ls -l dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography==46.0.5

      - name: Check the files and write latest.json
        run: python scripts/release.py dist "$GITHUB_REF_NAME"

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # this endpoint only sees published releases: those are never replaced
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already published; release a new version instead"
            exit 1
          fi
          # drafts for this tag from earlier runs make way for this one
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          cat > notes.md <<'NOTES'
          See the README for what's new.

          Windows may warn "unknown publisher" (the app isn't signed yet): More info → Run anyway.

          Made by Gourav Soni (X: @gouravsoni88).
          NOTES
          gh release create "$TAG" --draft --verify-tag --title "DbOtter $TAG" --notes-file notes.md \
            dist/DbOtter_"${TAG#v}"_* dist/latest.json
