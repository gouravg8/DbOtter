# Builds the Ubuntu and Windows packages.
#
# - Push a version tag (git tag v0.0.2 && git push origin v0.0.2): builds both and puts the
#   files on a draft GitHub Release, to check and publish.
# - Actions tab → Build → Run workflow: builds both and attaches the files to the run.
#
# Ubuntu builds on 22.04 on purpose: its packages also run on newer Ubuntu, not the other
# way round. The Windows installer (-setup.exe) installs per user, without admin rights, and
# adds DbOtter to the Start menu and search. Nothing is code-signed yet.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # a tag makes a draft release with the files; a manual run only builds
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: DbOtter ${{ github.ref_name }}
          releaseBody: See the README for what's new. Windows may warn "unknown publisher" (the app isn't signed yet): More info → Run anyway.
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

      - name: Attach the files to the run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DbOtter-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
