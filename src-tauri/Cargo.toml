[package]
name = "dbotter"
version = "0.0.2"
description = "A fast, keyboard-first client for PostgreSQL, MySQL / MariaDB and SQLite"
authors = ["Gourav Soni"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.2"
# ring instead of aws-lc-rs: no cmake / nasm needed to build
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "native-certs"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0.9"
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2.0.21"
futures-util = "0.3.34"
keyring = "4.2.0"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tiny_http = "0.12.0"
